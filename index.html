<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ora | Ask about Zakria Khan</title>
  <meta name="description" content="Ora is a chat demo styled like a code editor. Ask about Zakria Khan, a web developer: his projects, stack, education, services and how to reach him. Answers are written by Zakria.">
  <meta name="author" content="Zakria Khan">
  <meta name="theme-color" content="#0b0e14">
  <link rel="canonical" href="https://zakyprojects.github.io/ora-frontened/">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/plex-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    try { if (localStorage.getItem('ora_theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
</head>
<body>
  <div class="ide">
    <!-- Title bar -->
    <header class="titlebar">
      <button class="tb-btn files-btn" id="files-btn" type="button" aria-label="Show topics" aria-expanded="false" aria-controls="explorer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <div class="brand">
        <img class="avatar" src="avatar.svg" width="26" height="26" alt="">
        <span class="brand-name">ora</span>
        <span class="brand-path">~/zakria</span>
        <span class="tag">demo</span>
      </div>
      <button class="palette-btn" id="palette-btn" type="button" aria-label="Open command palette">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search questions</span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="tb-actions">
        <button class="tb-btn" id="reset-btn" type="button" aria-label="New chat" title="New chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="tb-btn" id="theme-btn" type="button" aria-label="Switch light or dark theme" title="Theme">
          <svg class="i-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a class="tb-link" href="https://zakyprojects.github.io/">Portfolio <span aria-hidden="true">↗</span></a>
      </div>
    </header>

    <!-- Explorer: each topic is a "file" Ora reads from -->
    <aside class="explorer" id="explorer" aria-label="Topics">
      <p class="ex-title">Explorer</p>
      <p class="ex-root"><span class="chev" aria-hidden="true">▾</span> zakria</p>
      <nav class="ex-tree" id="ex-tree"></nav>
      <div class="ex-card">
        <p class="ex-card-title">How Ora works</p>
        <p>No AI, no server. Zakria wrote every answer; Ora matches your question to the right file and types it out.</p>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <!-- Chat pane -->
    <section class="pane">
      <div class="tabs" role="presentation">
        <span class="tab active"><span class="dot-file ts" aria-hidden="true"></span>chat.ora</span>
        <span class="tab ghost" id="tab-file" hidden></span>
      </div>

      <main class="thread" id="thread" aria-live="polite" aria-label="Conversation"></main>

      <div class="composer-wrap">
        <div class="chips" id="chips" aria-label="Suggested questions"></div>
        <form class="composer" id="composer" autocomplete="off">
          <span class="prompt" aria-hidden="true">›</span>
          <label for="input" class="sr-only">Your question</label>
          <input id="input" type="text" maxlength="300" placeholder="ask about zakria's work…" enterkeyhint="send" spellcheck="false">
          <button id="send" type="submit" aria-label="Send" disabled>
            <span>Run</span><kbd>↵</kbd>
          </button>
        </form>
      </div>
    </section>

    <!-- Status bar -->
    <footer class="statusbar">
      <span class="sb-item sb-accent">⎇ main</span>
      <span class="sb-item sb-hide-xs">demo · no AI · answers by Zakria</span>
      <span class="sb-spacer"></span>
      <span class="sb-item sb-hide" id="sb-count">0 questions</span>
      <span class="sb-item" id="sb-clock" title="Zakria's local time">Risalpur --:--</span>
      <a class="sb-item sb-hide" href="https://zakyprojects.github.io/">built by Zakria Khan</a>
    </footer>
  </div>

  <!-- Command palette -->
  <div class="palette" id="palette" hidden>
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="palette-input">
        <span class="prompt" aria-hidden="true">›</span>
        <input id="palette-input" type="text" placeholder="type to filter questions and commands" spellcheck="false" aria-controls="palette-list" autocomplete="off">
        <kbd>Esc</kbd>
      </div>
      <ul class="palette-list" id="palette-list" role="listbox"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
