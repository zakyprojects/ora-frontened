<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ora | Ask about Zakria Khan</title>
  <meta name="description" content="Ora is a small chat demo. Ask about Zakria Khan, a web developer: his projects, stack, education, services and how to reach him. Every answer is written by Zakria.">
  <meta name="author" content="Zakria Khan">
  <meta name="theme-color" content="#0d1015">
  <link rel="canonical" href="https://zakyprojects.github.io/ora-frontened/">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/plex-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    // Saved choice wins; otherwise follow the device/browser theme (dark if unknown).
    try {
      var t = localStorage.getItem('ora_theme');
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
  </div>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img class="brand-av" src="avatar.svg" width="34" height="34" alt="">
        <div>
          <p class="brand-name">ora<span class="tag">demo</span></p>
          <p class="brand-sub">Ask about Zakria Khan</p>
        </div>
      </div>
      <div class="actions">
        <button class="icon-btn" id="reset-btn" type="button" aria-label="New chat" title="New chat">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch light or dark theme" title="Theme">
          <svg class="i-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a class="top-link" href="https://zakyprojects.github.io/">Portfolio</a>
      </div>
    </header>

    <main class="thread" id="thread" aria-live="polite" aria-label="Conversation"></main>

    <div class="bottom">
      <div class="chips" id="chips" aria-label="Suggested questions"></div>
      <form class="composer" id="composer" autocomplete="off">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <label for="input" class="sr-only">Your question</label>
        <input id="input" type="text" maxlength="300" placeholder="Ask something about Zakria…" enterkeyhint="send">
        <button id="send" type="submit" aria-label="Send" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <p class="foot">No AI. Every answer is written by Zakria.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
