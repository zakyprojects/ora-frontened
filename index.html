<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ora | Ask about Zakria Khan</title>
  <meta name="description" content="Ora is a small chat demo that answers questions about Zakria Khan, a web developer: his projects, skills, education and how to reach him. Answers are written by Zakria.">
  <meta name="author" content="Zakria Khan">
  <meta name="theme-color" content="#faf7f2">
  <link rel="canonical" href="https://zakyprojects.github.io/ora-frontened/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    try { if (localStorage.getItem('ora_theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="who">
        <span class="avatar" aria-hidden="true">O</span>
        <div class="who-text">
          <h1>Ora</h1>
          <p>Zakria's assistant <span class="tag">Demo</span></p>
        </div>
      </div>
      <div class="bar-actions">
        <button class="icon-btn" id="reset-btn" type="button" aria-label="Start a new chat" title="New chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch dark or light theme" title="Theme">
          <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="back" href="https://zakyprojects.github.io/">Portfolio</a>
      </div>
    </header>

    <main class="thread" id="thread" aria-live="polite" aria-label="Conversation"></main>

    <div class="composer-wrap">
      <div class="chips" id="chips" aria-label="Suggested questions"></div>
      <form class="composer" id="composer" autocomplete="off">
        <label for="input" class="sr-only">Your message</label>
        <input id="input" type="text" maxlength="300" placeholder="Ask about Zakria's work…" enterkeyhint="send">
        <button id="send" type="submit" aria-label="Send" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <p class="fine">Ora is a demo, not an AI. Every answer was written by Zakria, so she only knows his work. Built by <a href="https://zakyprojects.github.io/">Zakria Khan</a>.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
